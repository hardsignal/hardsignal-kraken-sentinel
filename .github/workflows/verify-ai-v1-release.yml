name: Verify Sentinel AI v1.0

on:
  push:
    paths:
      - 'ai/**'
      - 'scripts/verify_ai_artifact.py'
      - 'scripts/verify_ai_v1_release.py'
      - 'tests/ai/**'
      - 'tests/readiness/**'
      - 'results/ai/**'
      - 'results/ml/**'
      - 'docs/AI_V1_CONTRACT.md'
      - 'docs/sentinel-ai-artifact-v1.schema.json'
      - '.github/workflows/verify-ai-v1-release.yml'
  pull_request:
    paths:
      - 'ai/**'
      - 'scripts/verify_ai_artifact.py'
      - 'scripts/verify_ai_v1_release.py'
      - 'tests/ai/**'
      - 'tests/readiness/**'
      - 'results/ai/**'
      - 'results/ml/**'
      - 'docs/AI_V1_CONTRACT.md'
      - 'docs/sentinel-ai-artifact-v1.schema.json'
      - '.github/workflows/verify-ai-v1-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Sentinel AI v1 candidate
        run: python3 -B scripts/verify_ai_v1_release.py --candidate
