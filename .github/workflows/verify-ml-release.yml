name: Verify Sentinel ML release

on:
  push:
    paths:
      - 'ml/**'
      - 'tests/ml/**'
      - 'scripts/**'
      - 'results/ml/**'
      - '.github/workflows/verify-ml-release.yml'
  pull_request:
    paths:
      - 'ml/**'
      - 'tests/ml/**'
      - 'scripts/**'
      - 'results/ml/**'
      - '.github/workflows/verify-ml-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-ml-verification.txt
      - name: Install ML verification dependencies
        run: python -m pip install -r scripts/requirements-ml-verification.txt
      - name: Verify frozen release and run focused tests
        run: python -B scripts/verify_ml_release.py
